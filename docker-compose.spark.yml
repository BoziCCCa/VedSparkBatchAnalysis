# Spark standalone cluster: master, workers, history server.
# Requires the shared network:  docker network create bigdata   (start.sh does this)
#
# Web UIs: master http://localhost:8080   history server http://localhost:18081
#
# Two workers start by default. The third one is only started when named
# explicitly (start.sh 3) or with:  --profile scale

name: ved-spark

services:
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    hostname: spark-master
    environment:
      - INIT_DAEMON_STEP=setup_spark
    ports:
      - "8080:8080"   # web UI
      - "7077:7077"   # spark://spark-master:7077
    networks:
      - bigdata

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    networks:
      - bigdata

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    networks:
      - bigdata

  spark-worker-3:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-3
    hostname: spark-worker-3
    profiles: ["scale"]
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8083:8081"
    depends_on:
      - spark-master
    networks:
      - bigdata

  spark-history-server:
    image: bde2020/spark-history-server:3.3.0-hadoop3.3
    container_name: spark-history-server
    ports:
      - "18081:18081"
    volumes:
      - spark-events:/tmp/spark-events
    depends_on:
      - spark-master
    networks:
      - bigdata

volumes:
  # Fixed name so the application's compose file can attach to the same volume.
  spark-events:
    name: spark-events

networks:
  bigdata:
    external: true
