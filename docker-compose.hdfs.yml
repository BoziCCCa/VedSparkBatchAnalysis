# HDFS: storage layer.
# Requires the shared network:  docker network create bigdata   (start.sh does this)
#
# Web UI: http://localhost:9870

name: ved-hdfs

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=ved
    env_file:
      - ./hadoop.env
    ports:
      - "9870:9870"   # web UI
      - "9000:9000"   # hdfs://namenode:9000
    volumes:
      - hdfs-namenode:/hadoop/dfs/name
      - ./data:/data  # local ./data folder, used for uploading files to HDFS
    networks:
      - bigdata

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop.env
    volumes:
      - hdfs-datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - bigdata

volumes:
  hdfs-namenode:
  hdfs-datanode:

networks:
  bigdata:
    external: true
